# Target: 139.224.25.251. Temporary HTTP-only ACME bootstrap; no vault access.
# Install as /etc/nginx/conf.d/password-recorder.conf and run nginx -t before reload.
server {
    listen 80;
    server_name 139.224.25.251;
    access_log off;
    if ($host != "139.224.25.251") { return 403; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/password-recorder-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 403; }
}
